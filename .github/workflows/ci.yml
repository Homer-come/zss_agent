# CI: 跑后端单测 + 前端构建 + Docker 构建冒烟
# 设计原则：
#   - PR / push 到 master 时触发
#   - 后端用本地 H2 跑 mvn test，不依赖任何外部服务
#   - 前端只 build 不跑 lint（前端没配 ESLint，先不强求）

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend-test:
    name: Backend (mvn test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        working-directory: backend
        run: mvn -B -ntp test
        env:
          # 显式关掉外部依赖，让 H2 + Flyway + 本地降级路径接管
          DEEPSEEK_ENABLED: 'false'
          FIRECRAWL_ENABLED: 'false'

  backend-package:
    name: Backend (jar package)
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build jar
        working-directory: backend
        run: mvn -B -ntp -DskipTests package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  frontend-build:
    name: Frontend (npm run build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-smoke:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: zss-agent-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max